name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    env:
      # Public-by-design browser keys (embedded in every client bundle), supplied
      # as repo variables so the production build can prerender pages that
      # construct a Supabase client (login, reset-password, (app) shell).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  verify-live-db:
    name: Live Supabase RLS + Agentic verification
    runs-on: ubuntu-latest
    # Runs on every push/PR but the live-DB steps below are skipped unless the
    # project credentials are configured in repo secrets (an absent secret
    # results in an empty env var). These exercises write throwaway users/rows
    # and clean up after themselves.
    # NOTE: `secrets` is NOT allowed in a job-level `if:` expression (GitHub
    # Actions workflow validation rejects it), so the gate lives at step level
    # via `env.SUPABASE_SERVICE_ROLE_KEY` instead.
    needs: build
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: RLS cross-user verification
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run verify:rls

      - name: Agentic V4 schema verification
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run verify:agentic

      - name: Live-DB verification skipped (no credentials configured)
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "SUPABASE_SERVICE_ROLE_KEY not configured in repo secrets; skipping live-DB RLS/agentic verification."